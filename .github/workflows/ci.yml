name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon :profiler:testDebugUnitTest

      - name: Demo app builds
        run: ./gradlew --no-daemon :demo:assembleDebug

      - name: Library publishes (local repository)
        run: ./gradlew --no-daemon :profiler:publishReleasePublicationToBuildDirRepository

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: profiler/build/test-results/
